# @package _global_
defaults:
  - /configs/roboflow_v100/roboflow_v100_full_ft_100_images
  - _self_

# Query-aware appearance adaptation. Localization, grouping, mask decoding, and
# presence remain frozen; hs_proj can assign different scores to different queries.
paths:
  roboflow_vl_100_root: /workspace/sam3_official/fork_finetuning/data
  experiment_log_dir: /workspace/sam3_official/fork_finetuning/experiments/scissors_complete12_concept_query_o2o
  bpe_path: /workspace/sam3_official/sam3/assets/bpe_simple_vocab_16e6.txt.gz

roboflow_train:
  num_images: null
  supercategory: Scissors.complete12.concept.coco
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 0.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        weight_dict:
          loss_ce: 20.0
          presence_loss: 0.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: false
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
    loss_fn_semantic_seg: null
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  enable_segmentation: false
  max_data_epochs: 20
  num_train_workers: 0
  train_batch_size: 2
  gradient_accumulation_steps: 1
  lr_prompt_scoring: 1.0e-5
  lr_query_scoring: 2.0e-6
  scheduler_timescale: 20
  scheduler_warmup: 10
  scheduler_cooldown: 20

trainer:
  skip_saving_ckpts: false
  max_epochs: 20
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}
  model:
    _target_: sam3.train.heads_only_model_builder.build_sam3_image_model_concept_query_scoring
    checkpoint_path: /workspace/sam3_official/checkpoints/sam3.pt
    load_from_HF: false
  optim:
    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_query_scoring}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_prompt_scoring}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - dot_prod_scoring.prompt_mlp.*
            - dot_prod_scoring.prompt_proj.*
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0

launcher:
  gpus_per_node: 1
  use_cluster: false
  job_array:
    num_tasks: 1
    task_index: 0
