# @package _global_
defaults:
  - /configs/fork/fork_scissors_joint_balanced_official_full_ft
  - _self_

# Full 20-epoch run from the original SAM3 checkpoint on the joint dataset
# containing all five Forks_plate.coco images in the fork train split.
paths:
  experiment_log_dir: /workspace/sam3_official/fork_finetuning/experiments/fork_scissors_joint_plate_v3_20ep_full_ft

roboflow_train:
  supercategory: ForkScissors.joint.plate_v2.full_ft

joint_train_dataset:
  samples_per_concept: 33

# The original learning rate produced non-finite matcher costs in epoch 9;
# resume from the finite epoch-8 checkpoint with a lower learning rate.
scratch:
  lr_transformer: 2.0e-05
  lr_vision_backbone: 6.25e-06
  lr_language_backbone: 1.25e-06

trainer:
  max_epochs: 20
  val_epoch_freq: 10
  model:
    checkpoint_path: /workspace/sam3_official/checkpoints/sam3.pt
    load_from_HF: false
