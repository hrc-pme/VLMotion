# @package _global_
defaults:
  - fork_f3_bbox_50
  - _self_

# Preserve text-only detection while using prompted correction as an auxiliary loss.
paths:
  experiment_log_dir: /workspace/sam3_official/fork_finetuning/experiments/fork_f3_bbox_50_interactive_v2

scratch:
  lr_scale: 0.01
  max_data_epochs: 5

roboflow_train:
  loss:
    interactive_step_loss_weight: 0.25

trainer:
  max_epochs: 5
  val_epoch_freq: 5
  model:
    checkpoint_path: /workspace/sam3_official/fork_finetuning/experiments/fork_f3_bbox_50_batch2/checkpoints/checkpoint.pt
    num_interactive_steps_train: 1
    interactive_prompt_score_threshold: 0.25
    interactive_prompt_match_iou: 0.5
    interactive_prompt_negative_max_iou: 0.1
    interactive_prompt_probability: 0.5
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0
