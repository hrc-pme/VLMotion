# @package _global_
defaults:
  - /configs/fork/fork_scissors_joint_balanced_official_full_ft
  - _self_

# Continue the existing fork/scissors bbox-only model with all plate images in train.
paths:
  experiment_log_dir: /workspace/sam3_official/fork_finetuning/experiments/fork_scissors_joint_plate_v2_full_ft

roboflow_train:
  supercategory: ForkScissors.joint.plate_v2.full_ft

scratch:
  max_data_epochs: 5
  lr_transformer: 2.0e-05
  lr_vision_backbone: 6.25e-06
  lr_language_backbone: 1.25e-06

joint_train_dataset:
  samples_per_concept: 33

trainer:
  max_epochs: 5
  val_epoch_freq: 5
  model:
    checkpoint_path: /workspace/sam3_official/fork_finetuning/experiments/fork_scissors_joint_balanced_official_full_ft/checkpoints/checkpoint.pt
    load_from_HF: false

