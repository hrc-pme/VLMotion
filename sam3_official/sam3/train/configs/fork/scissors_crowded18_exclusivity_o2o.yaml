# @package _global_
defaults:
  - scissors_crowded18_last_decoder_o2o
  - _self_

# Controlled extension of bbox-only O2O: masks provide only a negative signal
# where a matched query spills into another annotated scissors instance.
paths:
  experiment_log_dir: /workspace/sam3_official/fork_finetuning/experiments/scissors_crowded18_exclusivity_o2o

roboflow_train:
  supercategory: Scissors.crowded18.mask_o2o.coco
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 0.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        weight_dict:
          loss_ce: 20.0
          presence_loss: 0.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: false
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.MaskExclusivity
        weight_dict:
          loss_exclusivity: 5.0
        compute_aux: false
    loss_fn_semantic_seg: null
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  enable_segmentation: true

trainer:
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0
