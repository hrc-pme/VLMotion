# @package _global_
defaults:
  - fork_v1_multiclass_seg_decoder_heads
  - _self_

paths:
  experiment_log_dir: /workspace/sam3_official/fork_finetuning/experiments/scissors_v7_seg_decoder_heads_300_images

roboflow_train:
  num_images: 300
  supercategory: Scissors.v7i.sam3
  loss:
    o2m_weight: 1.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.55
      topk: 2
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        weight_dict:
          loss_ce: 20.0
          presence_loss: 20.0
        pos_weight: 5.0
        alpha: 0.25
        gamma: 2
        use_presence: true
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false

scratch:
  max_epochs: 5

trainer:
  max_epochs: 5
