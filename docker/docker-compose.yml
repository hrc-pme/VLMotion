services:
  vlpoint-sam3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # image: docker-vlpoint-inference:latest
    container_name: vlpoint-sam3
    hostname: vlpoint-dev
    restart: unless-stopped
    gpus: all
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - HF_HOME=/root/.cache/huggingface
      - ROS_DOMAIN_ID=42
    volumes:
      # - ../models:/workspace/models:ro  # 模型目錄（只讀）
      - ../:/workspace
      - ../.cache/huggingface:/root/.cache/huggingface
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # X11 支援（如果需要）
      - /dev/dri:/dev/dri:rw  # GPU access for hardware acceleration
      # RealSense SDK also needs the USB device, not only V4L2 interfaces.
      - /dev/bus/usb:/dev/bus/usb:rw
    network_mode: "host"
    privileged: true
    devices:
      # The replacement D435 currently enumerates as video6 through video11.
      - /dev/video6:/dev/video6
      - /dev/video7:/dev/video7
      - /dev/video8:/dev/video8
      - /dev/video9:/dev/video9
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
    group_add:
      - video  # 添加到 video 群組以獲得攝影機權限
    stdin_open: true
    tty: true
