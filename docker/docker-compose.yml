services:
  vlmotion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vlmotion-hellorobot:latest
    container_name: vlmotion
    hostname: vlmotion
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      XDG_RUNTIME_DIR: /tmp/runtime-root
      XAUTHORITY: /tmp/.docker.xauth

      # Must match the profile/domain selected in helloRobot_stretch3/run.sh.
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ZENOH_PROFILE: ${ZENOH_PROFILE:-local}
      ZENOH_ROUTER_HOST: ${ZENOH_ROUTER_HOST:-127.0.0.1}
      ZENOH_ROUTER_PORT: ${ZENOH_ROUTER_PORT:-7447}
      ZENOH_CONFIG_OVERRIDE: 'mode="client";connect/endpoints=["tcp/${ZENOH_ROUTER_HOST:-127.0.0.1}:${ZENOH_ROUTER_PORT:-7447}"]'

      VLMOTION_CONTROLLER_URL: ${VLMOTION_CONTROLLER_URL:-http://192.168.0.222:11000}
      VLMOTION_MODEL_PATH: ${VLMOTION_MODEL_PATH:-PME033541/vla13}
      # Motion stays opt-in until topics and TF have been verified.
      VLMOTION_ENABLE_MOTION: ${VLMOTION_ENABLE_MOTION:-false}
      VLMOTION_ENABLE_STT: ${VLMOTION_ENABLE_STT:-true}
      VLMOTION_STT_MODEL_PATH: ${VLMOTION_STT_MODEL_PATH:-small}
      VLMOTION_STT_MODEL_DIR: ${VLMOTION_STT_MODEL_DIR:-/models/faster-whisper}
      VLMOTION_STT_LANGUAGE: ${VLMOTION_STT_LANGUAGE:-auto}
      VLMOTION_STT_CPU_THREADS: ${VLMOTION_STT_CPU_THREADS:-8}
      # helloRobot_stretch3 publishes odometry but currently disables its TF.
      VLMOTION_PUBLISH_ODOM_TF: ${VLMOTION_PUBLISH_ODOM_TF:-true}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      - ../ros2_ws/src/audio_common/speech_recognition_msgs:/workspace/ros2_ws/src/speech_recognition_msgs:ro
      - ../ros2_ws/src/vlmotion_stt:/workspace/ros2_ws/src/vlmotion_stt:ro
      - ../ros2_ws/src/vlpoint:/workspace/ros2_ws/src/vlpoint:ro
      - ../ros2_ws/src/white_point_pipeline:/workspace/ros2_ws/src/white_point_pipeline:ro
      - ../Outputs:/workspace/Outputs:rw
      - ../models/faster-whisper:/models/faster-whisper:rw
      - ../environment.sh:/workspace/environment.sh:ro
      - vlmotion-build:/workspace/ros2_ws/build
      - vlmotion-install:/workspace/ros2_ws/install
      - vlmotion-log:/workspace/ros2_ws/log

    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  vlmotion-build:
  vlmotion-install:
  vlmotion-log:
