# D435i 相機 TF 校準配置
# 此文件由 camera_tf_calibrator 工具生成，或手動編輯
# 
# 使用方式:
#   1. 運行校準工具: ros2 run white_point_pipeline camera_tf_calibrator
#   2. 或直接編輯此文件的數值
#
# 坐標系說明:
#   parent_frame: camera_bottom_screw_frame (RealSense 發布的相機底座 frame)
#   child_frame: d435i_link (我們調整後的相機 frame)
#
# 調整策略:
#   - 位移 (x, y, z) 在 parent_frame 坐標系中
#   - 旋轉 (roll, pitch, yaw) 應用於 child_frame
#   - 先調位移，再調旋轉，可減少互相影響

# 位移 (米)
x: 0.0
y: 0.0
z: 0.0

# 旋轉 (度) - 更直觀
roll_deg: 0.0
pitch_deg: 0.0
yaw_deg: 0.0

# 旋轉 (弧度) - 用於 launch 文件
roll_rad: 0.0
pitch_rad: 0.0
yaw_rad: 0.0

# Frame 設定
parent_frame: camera_bottom_screw_frame
child_frame: d435i_link
